    <rect x="0" y="0" width="36" height="36" rx="8" fill="#00529C"/>
    <text x="18" y="26" font-family="'Inter', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" font-style="italic">BRI</text>
  </g>
  <!-- Text BANK BRI -->
  <text x="50" y="24" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="#00529C" letter-spacing="1">BANK</text>
  <text x="50" y="38" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" fill="#00529C" letter-spacing="0">BRI</text>
  <!-- Accent orange curve -->
  <circle cx="106" cy="30" r="3.5" fill="url(#briOrange)"/>
