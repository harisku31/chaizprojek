<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" width="100%" height="100%">
  <defs>
    <!-- Filter Glow Efek Neon -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a0f1e" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <radialGradient id="nebula-cyan" cx="15%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-purple" cx="85%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-gold" cx="50%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(34, 211, 238, 0.05)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(34, 211, 238, 0.25)" />
    </pattern>

    <!-- Card Badge Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.14)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyan-diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1920" height="760" fill="url(#bg-grad)" />
  <rect width="1920" height="760" fill="url(#nebula-cyan)" />
  <rect width="1920" height="760" fill="url(#nebula-purple)" />
  <rect width="1920" height="760" fill="url(#nebula-gold)" />
  <rect width="1920" height="760" fill="url(#cyber-grid)" />

  <!-- Digital Tech Circuit Lines -->
  <g stroke="rgba(6, 182, 212, 0.18)" stroke-width="1.5" fill="none">
    <path d="M 0 180 L 260 180 L 340 260 L 500 260" />
    <circle cx="500" cy="260" r="3.5" fill="#22d3ee" />
    <path d="M 0 540 L 220 540 L 300 460 L 460 460" />
    <circle cx="460" cy="460" r="3.5" fill="#22d3ee" />
    
    <path d="M 1920 180 L 1660 180 L 1580 260 L 1420 260" stroke="rgba(168, 85, 247, 0.25)" />
    <circle cx="1420" cy="260" r="3.5" fill="#c084fc" />
    <path d="M 1920 540 L 1700 540 L 1620 460 L 1460 460" stroke="rgba(168, 85, 247, 0.25)" />
    <circle cx="1460" cy="460" r="3.5" fill="#c084fc" />
  </g>

  <!-- ========================================================= -->
  <!-- 2. KUMPULAN FLOATING LOGO TOP UP & GAMES (SISI KIRI)       -->
  <!-- ========================================================= -->

  <!-- [Logo 1] STEAM LOGO BADGE (X: 130, Y: 110) -->
  <g transform="translate(130, 110) rotate(-6)" filter="url(#glow-cyan)">
    <rect width="115" height="115" rx="26" fill="url(#card-grad)" stroke="rgba(34, 211, 238, 0.5)" stroke-width="1.5" />
    <circle cx="57" cy="55" r="36" fill="#171a21" stroke="#22d3ee" stroke-width="2" />
    <!-- Steam Vector Path -->
    <path d="M 57 33 C 46 33 37 41 35 51 L 45 55 C 46 51 50 48 55 48 C 61 48 66 53 66 59 C 66 65 61 70 55 70 L 49 70 C 49 67 46 65 43 65 C 40 65 37 67 37 71 C 37 74 40 77 43 77 C 46 77 49 75 49 72 L 55 72 C 62 72 68 66 68 59 C 68 45 57 33 57 33 Z" fill="#ffffff" />
    <circle cx="70" cy="42" r="7" fill="#22d3ee" />
    <text x="57" y="102" fill="#22d3ee" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">STEAM</text>
  </g>

  <!-- [Logo 2] MOBILE LEGENDS (MLBB) DIAMOND GEM (X: 70, Y: 290) -->
  <g transform="translate(70, 290) rotate(8)" filter="url(#glow-cyan)">
    <rect width="125" height="120" rx="28" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" />
    <!-- 3D Diamond Vector -->
    <path d="M 62 25 L 100 48 L 62 94 L 24 48 Z" fill="url(#cyan-diamond)" />
    <path d="M 62 25 L 62 94" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" />
    <path d="M 24 48 L 100 48" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" />
    <path d="M 42 25 L 48 48 L 62 94" fill="rgba(255,255,255,0.3)" />
    <path d="M 82 25 L 76 48 L 62 94" fill="rgba(255,255,255,0.15)" />
    <text x="62" y="110" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">DIAMOND ML</text>
  </g>

  <!-- [Logo 3] PLAYSTATION CONTROLLER & ICONS (X: 250, Y: 230) -->
  <g transform="translate(250, 230) rotate(-10)" filter="url(#glow-purple)">
    <rect width="125" height="115" rx="26" fill="url(#card-grad)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5" />
    <!-- Gamepad Vector -->
    <path d="M 42 42 C 34 42 27 50 27 60 C 27 69 32 78 38 80 C 42 81 46 76 49 71 L 53 66 L 72 66 L 76 71 C 79 76 83 81 87 80 C 93 78 98 69 98 60 C 98 50 91 42 83 42 Z" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
    <circle cx="46" cy="56" r="4" fill="#22d3ee" />
    <circle cx="79" cy="52" r="2.5" fill="#ec4899" />
    <circle cx="85" cy="58" r="2.5" fill="#10b981" />
    <circle cx="73" cy="58" r="2.5" fill="#f59e0b" />
    <circle cx="79" cy="64" r="2.5" fill="#38bdf8" />
    <text x="62" y="104" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PLAYSTATION</text>
  </g>

  <!-- [Logo 4] SPOTIFY PREMIUM (X: 130, Y: 480) -->
  <g transform="translate(130, 480) rotate(5)">
    <rect width="115" height="105" rx="24" fill="url(#card-grad)" stroke="rgba(34, 197, 94, 0.45)" stroke-width="1.5" />
    <circle cx="57" cy="48" r="25" fill="#22c55e" />
    <!-- Wave lines -->
    <path d="M 43 43 C 51 39 63 39 71 44" stroke="#121212" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 45 49 C 52 46 61 46 68 50" stroke="#121212" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 48 55 C 53 53 60 53 65 56" stroke="#121212" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="57" y="92" fill="#4ade80" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">SPOTIFY</text>
  </g>

  <!-- [Logo 5] DISCORD NITRO GEM (X: 280, Y: 430) -->
  <g transform="translate(280, 430) rotate(-5)" filter="url(#glow-purple)">
    <rect width="110" height="105" rx="24" fill="url(#card-grad)" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1.5" />
    <polygon points="55,26 80,46 67,75 43,75 30,46" fill="#5865f2" />
    <polygon points="55,26 80,46 55,52" fill="rgba(255,255,255,0.4)" />
    <polygon points="55,26 30,46 55,52" fill="rgba(255,255,255,0.2)" />
    <text x="55" y="92" fill="#a78bfa" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">NITRO</text>
  </g>

  <!-- ========================================================= -->
  <!-- 3. KUMPULAN FLOATING LOGO TOP UP & GAMES (SISI KANAN)      -->
  <!-- ========================================================= -->

  <!-- [Logo 6] FREE FIRE DIAMOND GEM (X: 1670, Y: 110) -->
  <g transform="translate(1670, 110) rotate(7)" filter="url(#glow-gold)">
    <rect width="118" height="115" rx="26" fill="url(#card-grad)" stroke="rgba(245, 158, 11, 0.55)" stroke-width="1.5" />
    <path d="M 59 24 L 94 48 L 59 92 L 24 48 Z" fill="url(#gold-metal)" />
    <path d="M 59 24 L 59 92" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" />
    <path d="M 24 48 L 94 48" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" />
    <!-- Flame accent -->
    <path d="M 59 34 C 62 38 66 44 63 48 C 60 45 57 44 59 34 Z" fill="#ef4444" />
    <text x="59" y="104" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">FREE FIRE</text>
  </g>

  <!-- [Logo 7] VALORANT V SHIELD (X: 1530, Y: 220) -->
  <g transform="translate(1530, 220) rotate(-8)" filter="url(#glow-red)">
    <rect width="125" height="120" rx="26" fill="url(#card-grad)" stroke="rgba(244, 63, 94, 0.55)" stroke-width="1.5" />
    <!-- Valorant iconic geometric V -->
    <path d="M 40 35 L 59 35 L 82 75 L 63 75 Z" fill="#ff4655" />
    <path d="M 86 35 L 75 35 L 64 54 L 75 54 Z" fill="#ff4655" />
    <text x="62" y="105" fill="#fb7185" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">VALORANT</text>
  </g>

  <!-- [Logo 8] XBOX GAME PASS (X: 1720, Y: 280) -->
  <g transform="translate(1720, 280) rotate(5)">
    <rect width="118" height="118" rx="26" fill="url(#card-grad)" stroke="rgba(34, 197, 94, 0.5)" stroke-width="1.5" />
    <circle cx="59" cy="54" r="29" fill="#107c10" />
    <!-- Xbox X Cutout -->
    <path d="M 43 38 C 48 44 54 51 59 58 C 64 51 70 44 75 38 C 70 36 65 35 59 35 C 53 35 48 36 43 38 Z" fill="#ffffff" />
    <path d="M 37 45 C 45 53 53 61 57 66 C 49 69 41 70 35 64 C 33 58 34 51 37 45 Z" fill="#ffffff" />
    <path d="M 81 45 C 73 53 65 61 61 66 C 69 69 77 70 83 64 C 85 58 84 51 81 45 Z" fill="#ffffff" />
    <text x="59" y="105" fill="#4ade80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">XBOX</text>
  </g>

  <!-- [Logo 9] YOUTUBE PREMIUM (X: 1530, Y: 430) -->
  <g transform="translate(1530, 430) rotate(-6)" filter="url(#glow-red)">
    <rect width="125" height="105" rx="24" fill="url(#card-grad)" stroke="rgba(239, 68, 68, 0.45)" stroke-width="1.5" />
    <rect x="32" y="30" width="62" height="40" rx="11" fill="#ff0000" />
    <polygon points="56,40 73,50 56,60" fill="#ffffff" />
    <text x="62" y="92" fill="#f87171" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">YOUTUBE</text>
  </g>

  <!-- [Logo 10] NETFLIX PREMIUM (X: 1680, Y: 480) -->
  <g transform="translate(1680, 480) rotate(8)">
    <rect width="115" height="105" rx="24" fill="url(#card-grad)" stroke="rgba(229, 9, 20, 0.45)" stroke-width="1.5" />
    <!-- Netflix N Ribbon -->
    <path d="M 46 28 L 54 28 L 54 72 L 46 72 Z" fill="#b81d24" />
    <path d="M 70 28 L 78 28 L 78 72 L 70 72 Z" fill="#b81d24" />
    <path d="M 46 28 L 70 72 L 78 72 L 54 28 Z" fill="#e50914" filter="url(#glow-red)" />
    <text x="62" y="92" fill="#ef4444" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">NETFLIX</text>
  </g>

  <!-- ========================================================= -->
  <!-- 4. FLOATING GOLD COINS & ENERGY LIGHTNING SPARKLES         -->
  <!-- ========================================================= -->
  <!-- Gold Coins -->
  <g transform="translate(420, 160)" filter="url(#glow-gold)">
    <circle cx="20" cy="20" r="18" fill="url(#gold-metal)" stroke="#fef08a" stroke-width="2" />
    <text x="20" y="26" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>
  <g transform="translate(450, 490)" filter="url(#glow-gold)">
    <circle cx="18" cy="18" r="15" fill="url(#gold-metal)" stroke="#fef08a" stroke-width="1.5" />
    <text x="18" y="23" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>
  <g transform="translate(1440, 150)" filter="url(#glow-gold)">
    <circle cx="20" cy="20" r="18" fill="url(#gold-metal)" stroke="#fef08a" stroke-width="2" />
    <text x="20" y="26" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>
  <g transform="translate(1410, 500)" filter="url(#glow-gold)">
    <circle cx="18" cy="18" r="15" fill="url(#gold-metal)" stroke="#fef08a" stroke-width="1.5" />
    <text x="18" y="23" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>

  <!-- Glowing Sparkle Crosses -->
  <g fill="#22d3ee" opacity="0.8">
    <path d="M 480 340 Q 480 355 495 355 Q 480 355 480 370 Q 480 355 465 355 Q 480 355 480 340 Z" />
    <path d="M 1390 320 Q 1390 335 1405 335 Q 1390 335 1390 350 Q 1390 335 1375 335 Q 1390 335 1390 320 Z" fill="#c084fc" />
    <circle cx="360" cy="180" r="2.5" />
    <circle cx="1480" cy="380" r="2.5" fill="#fbbf24" />
    <circle cx="230" cy="400" r="3" />
    <circle cx="1630" cy="200" r="3" />
  </g>

  <!-- ========================================================= -->
  <!-- 5. CENTER VIGNETTE GRADIENT (AGAR TEKS DEPAN SANGAT JELAS) -->
  <!-- ========================================================= -->
  <radialGradient id="center-dark" cx="50%" cy="45%" r="42%">
    <stop offset="0%" stop-color="#060913" stop-opacity="0.65" />
    <stop offset="60%" stop-color="#060913" stop-opacity="0.45" />
    <stop offset="100%" stop-color="#060913" stop-opacity="0" />
  </radialGradient>
  <rect width="1920" height="760" fill="url(#center-dark)" />
</svg>
