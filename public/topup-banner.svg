<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" width="100%" height="100%">
  <defs>
    <!-- Filter Glow Efek Neon Terang & Jelas -->
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Gradients Terang & Berwarna -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <radialGradient id="nebula-cyan" cx="15%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-purple" cx="85%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-gold" cx="50%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Grid Pattern Jelas -->
    <pattern id="cyber-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(34, 211, 238, 0.12)" stroke-width="1.2" />
      <circle cx="0" cy="0" r="2" fill="rgba(34, 211, 238, 0.5)" />
    </pattern>

    <!-- Card Badge Gradients Solid & Terang -->
    <linearGradient id="card-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#162032" />
    </linearGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyan-diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1920" height="760" fill="url(#bg-grad)" />
  <rect width="1920" height="760" fill="url(#nebula-cyan)" />
  <rect width="1920" height="760" fill="url(#nebula-purple)" />
  <rect width="1920" height="760" fill="url(#nebula-gold)" />
  <rect width="1920" height="760" fill="url(#cyber-grid)" />

  <!-- Digital Tech Circuit Lines Terang -->
  <g stroke="rgba(34, 211, 238, 0.35)" stroke-width="2" fill="none" filter="url(#glow-cyan)">
    <path d="M 0 180 L 260 180 L 340 260 L 500 260" />
    <circle cx="500" cy="260" r="4.5" fill="#22d3ee" />
    <path d="M 0 540 L 220 540 L 300 460 L 460 460" />
    <circle cx="460" cy="460" r="4.5" fill="#22d3ee" />
    
    <path d="M 1920 180 L 1660 180 L 1580 260 L 1420 260" stroke="rgba(192, 132, 252, 0.45)" />
    <circle cx="1420" cy="260" r="4.5" fill="#c084fc" />
    <path d="M 1920 540 L 1700 540 L 1620 460 L 1460 460" stroke="rgba(192, 132, 252, 0.45)" />
    <circle cx="1460" cy="460" r="4.5" fill="#c084fc" />
  </g>

  <!-- ========================================================= -->
  <!-- 2. KUMPULAN FLOATING LOGO TOP UP & GAMES (SISI KIRI)       -->
  <!-- ========================================================= -->

  <!-- [Logo 1] STEAM LOGO BADGE (X: 130, Y: 110) -->
  <g transform="translate(130, 110) rotate(-6)" filter="url(#glow-cyan)">
    <rect width="125" height="125" rx="26" fill="url(#card-grad-cyan)" stroke="#22d3ee" stroke-width="2.5" />
    <circle cx="62" cy="58" r="38" fill="#171a21" stroke="#22d3ee" stroke-width="2.5" />
    <!-- Steam Vector Path -->
    <path d="M 62 35 C 50 35 40 43 38 54 L 49 58 C 50 54 54 51 59 51 C 66 51 71 56 71 63 C 71 70 66 75 59 75 L 53 75 C 53 71 50 69 47 69 C 43 69 40 72 40 76 C 40 79 43 83 47 83 C 50 83 53 80 53 77 L 59 77 C 67 77 73 71 73 63 C 73 48 62 35 62 35 Z" fill="#ffffff" />
    <circle cx="76" cy="44" r="7.5" fill="#22d3ee" />
    <text x="62" y="112" fill="#22d3ee" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">STEAM</text>
  </g>

  <!-- [Logo 2] MOBILE LEGENDS (MLBB) DIAMOND GEM (X: 70, Y: 290) -->
  <g transform="translate(70, 290) rotate(8)" filter="url(#glow-cyan)">
    <rect width="135" height="130" rx="28" fill="url(#card-grad-cyan)" stroke="#38bdf8" stroke-width="2.5" />
    <!-- 3D Diamond Vector -->
    <path d="M 67 24 L 108 48 L 67 98 L 26 48 Z" fill="url(#cyan-diamond)" />
    <path d="M 67 24 L 67 98" stroke="rgba(255,255,255,0.85)" stroke-width="2" />
    <path d="M 26 48 L 108 48" stroke="rgba(255,255,255,0.9)" stroke-width="2" />
    <path d="M 45 24 L 52 48 L 67 98" fill="rgba(255,255,255,0.4)" />
    <path d="M 89 24 L 82 48 L 67 98" fill="rgba(255,255,255,0.2)" />
    <text x="67" y="118" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="0.5">DIAMOND ML</text>
  </g>

  <!-- [Logo 3] PLAYSTATION CONTROLLER & ICONS (X: 250, Y: 230) -->
  <g transform="translate(250, 230) rotate(-10)" filter="url(#glow-purple)">
    <rect width="135" height="125" rx="26" fill="url(#card-grad-cyan)" stroke="#c084fc" stroke-width="2.5" />
    <!-- Gamepad Vector -->
    <path d="M 46 45 C 37 45 29 54 29 65 C 29 75 34 85 41 87 C 46 88 50 83 54 77 L 58 72 L 78 72 L 82 77 C 86 83 90 88 95 87 C 102 85 107 75 107 65 C 107 54 99 45 90 45 Z" fill="#1e1b4b" stroke="#a855f7" stroke-width="3" />
    <circle cx="50" cy="60" r="4.5" fill="#22d3ee" />
    <circle cx="85" cy="56" r="3" fill="#ec4899" />
    <circle cx="92" cy="62" r="3" fill="#10b981" />
    <circle cx="78" cy="62" r="3" fill="#f59e0b" />
    <circle cx="85" cy="69" r="3" fill="#38bdf8" />
    <text x="67" y="112" fill="#c084fc" font-family="sans-serif" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">PLAYSTATION</text>
  </g>

  <!-- [Logo 4] SPOTIFY PREMIUM (X: 130, Y: 480) -->
  <g transform="translate(130, 480) rotate(5)">
    <rect width="125" height="115" rx="26" fill="url(#card-grad-cyan)" stroke="#22c55e" stroke-width="2.5" />
    <circle cx="62" cy="52" r="28" fill="#22c55e" />
    <!-- Wave lines -->
    <path d="M 47 46 C 55 42 68 42 77 47" stroke="#121212" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 49 53 C 57 50 66 50 74 54" stroke="#121212" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 52 60 C 58 57 65 57 71 61" stroke="#121212" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <text x="62" y="100" fill="#4ade80" font-family="sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">SPOTIFY</text>
  </g>

  <!-- [Logo 5] DISCORD NITRO GEM (X: 280, Y: 430) -->
  <g transform="translate(280, 430) rotate(-5)" filter="url(#glow-purple)">
    <rect width="120" height="115" rx="26" fill="url(#card-grad-cyan)" stroke="#818cf8" stroke-width="2.5" />
    <polygon points="60,28 88,50 74,82 46,82 32,50" fill="#5865f2" />
    <polygon points="60,28 88,50 60,56" fill="rgba(255,255,255,0.45)" />
    <polygon points="60,28 32,50 60,56" fill="rgba(255,255,255,0.25)" />
    <text x="60" y="102" fill="#a5b4fc" font-family="sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">NITRO</text>
  </g>

  <!-- ========================================================= -->
  <!-- 3. KUMPULAN FLOATING LOGO TOP UP & GAMES (SISI KANAN)      -->
  <!-- ========================================================= -->

  <!-- [Logo 6] FREE FIRE DIAMOND GEM (X: 1660, Y: 110) -->
  <g transform="translate(1660, 110) rotate(7)" filter="url(#glow-gold)">
    <rect width="130" height="125" rx="26" fill="url(#card-grad-cyan)" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M 65 24 L 104 50 L 65 98 L 26 50 Z" fill="url(#gold-metal)" />
    <path d="M 65 24 L 65 98" stroke="rgba(255,255,255,0.85)" stroke-width="2" />
    <path d="M 26 50 L 104 50" stroke="rgba(255,255,255,0.9)" stroke-width="2" />
    <!-- Flame accent -->
    <path d="M 65 34 C 69 40 74 46 70 51 C 66 47 62 45 65 34 Z" fill="#ef4444" />
    <text x="65" y="114" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="0.5">FREE FIRE</text>
  </g>

  <!-- [Logo 7] VALORANT V SHIELD (X: 1510, Y: 220) -->
  <g transform="translate(1510, 220) rotate(-8)" filter="url(#glow-red)">
    <rect width="135" height="130" rx="28" fill="url(#card-grad-cyan)" stroke="#f43f5e" stroke-width="2.5" />
    <!-- Valorant iconic geometric V -->
    <path d="M 44 38 L 65 38 L 90 82 L 69 82 Z" fill="#ff4655" />
    <path d="M 94 38 L 82 38 L 70 59 L 82 59 Z" fill="#ff4655" />
    <text x="67" y="115" fill="#fb7185" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">VALORANT</text>
  </g>

  <!-- [Logo 8] XBOX GAME PASS (X: 1710, Y: 280) -->
  <g transform="translate(1710, 280) rotate(5)">
    <rect width="130" height="125" rx="26" fill="url(#card-grad-cyan)" stroke="#22c55e" stroke-width="2.5" />
    <circle cx="65" cy="56" r="32" fill="#107c10" />
    <!-- Xbox X Cutout -->
    <path d="M 47 40 C 53 47 60 54 65 62 C 70 54 77 47 83 40 C 77 37 71 36 65 36 C 59 36 53 37 47 40 Z" fill="#ffffff" />
    <path d="M 41 47 C 50 56 59 65 63 70 C 54 74 45 75 38 68 C 36 62 37 54 41 47 Z" fill="#ffffff" />
    <path d="M 89 47 C 80 56 71 65 67 70 C 76 74 85 75 92 68 C 94 62 93 54 89 47 Z" fill="#ffffff" />
    <text x="65" y="112" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">XBOX</text>
  </g>

  <!-- [Logo 9] YOUTUBE PREMIUM (X: 1520, Y: 430) -->
  <g transform="translate(1520, 430) rotate(-6)" filter="url(#glow-red)">
    <rect width="135" height="115" rx="26" fill="url(#card-grad-cyan)" stroke="#ef4444" stroke-width="2.5" />
    <rect x="35" y="32" width="66" height="44" rx="12" fill="#ff0000" />
    <polygon points="61,43 79,54 61,65" fill="#ffffff" />
    <text x="67" y="100" fill="#f87171" font-family="sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">YOUTUBE</text>
  </g>

  <!-- [Logo 10] NETFLIX PREMIUM (X: 1670, Y: 480) -->
  <g transform="translate(1670, 480) rotate(8)">
    <rect width="125" height="115" rx="26" fill="url(#card-grad-cyan)" stroke="#dc2626" stroke-width="2.5" />
    <!-- Netflix N Ribbon -->
    <path d="M 50 30 L 59 30 L 59 78 L 50 78 Z" fill="#b81d24" />
    <path d="M 76 30 L 85 30 L 85 78 L 76 78 Z" fill="#b81d24" />
    <path d="M 50 30 L 76 78 L 85 78 L 59 30 Z" fill="#e50914" filter="url(#glow-red)" />
    <text x="67" y="100" fill="#ef4444" font-family="sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">NETFLIX</text>
  </g>

  <!-- ========================================================= -->
  <!-- 4. FLOATING GOLD COINS & ENERGY LIGHTNING SPARKLES         -->
  <!-- ========================================================= -->
  <!-- Gold Coins -->
  <g transform="translate(420, 150)" filter="url(#glow-gold)">
    <circle cx="22" cy="22" r="20" fill="url(#gold-metal)" stroke="#fef08a" stroke-width="2.5" />
    <text x="22" y="29" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>
  <g transform="translate(450, 490)" filter="url(#glow-gold)">
    <circle cx="20" cy="20" r="17" fill="url(#gold-metal)" stroke="#fef08a" stroke-width="2" />
    <text x="20" y="26" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>
  <g transform="translate(1440, 140)" filter="url(#glow-gold)">
    <circle cx="22" cy="22" r="20" fill="url(#gold-metal)" stroke="#fef08a" stroke-width="2.5" />
    <text x="22" y="29" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>
  <g transform="translate(1410, 500)" filter="url(#glow-gold)">
    <circle cx="20" cy="20" r="17" fill="url(#gold-metal)" stroke="#fef08a" stroke-width="2" />
    <text x="20" y="26" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>

  <!-- Glowing Sparkle Crosses -->
  <g fill="#22d3ee" opacity="0.95" filter="url(#glow-cyan)">
    <path d="M 480 330 Q 480 348 498 348 Q 480 348 480 366 Q 480 348 462 348 Q 480 348 480 330 Z" />
    <path d="M 1390 310 Q 1390 328 1408 328 Q 1390 328 1390 346 Q 1390 328 1372 328 Q 1390 328 1390 310 Z" fill="#c084fc" />
    <circle cx="360" cy="170" r="3.5" />
    <circle cx="1480" cy="370" r="3.5" fill="#fbbf24" />
    <circle cx="220" cy="390" r="4" />
    <circle cx="1640" cy="190" r="4" />
  </g>
</svg>
