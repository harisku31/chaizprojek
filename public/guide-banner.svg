<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 620" width="100%" height="100%">
  <defs>
    <!-- Filter Glow Efek Neon Terang & Jelas -->
    <filter id="guide-glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="guide-glow-gold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="guide-glow-purple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="guide-glow-green" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients Background Cyber Jelas -->
    <linearGradient id="guide-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="guide-nebula-left" cx="18%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.48" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="guide-nebula-right" cx="82%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="guide-nebula-center" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Hex Grid Pattern -->
    <pattern id="guide-grid" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M 55 0 L 0 0 0 55" fill="none" stroke="rgba(34, 211, 238, 0.12)" stroke-width="1.2" />
      <circle cx="0" cy="0" r="2" fill="rgba(34, 211, 238, 0.45)" />
    </pattern>

    <!-- Glass Card Gradient Solid Kontras Tinggi -->
    <linearGradient id="guide-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#162032" />
    </linearGradient>
    <linearGradient id="cyan-blue-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1920" height="620" fill="url(#guide-bg)" />
  <rect width="1920" height="620" fill="url(#guide-nebula-left)" />
  <rect width="1920" height="620" fill="url(#guide-nebula-right)" />
  <rect width="1920" height="620" fill="url(#guide-nebula-center)" />
  <rect width="1920" height="620" fill="url(#guide-grid)" />

  <!-- 2. Cyber Circuit Lines & Tech Nodes -->
  <g stroke="rgba(34, 211, 238, 0.38)" stroke-width="2" fill="none" filter="url(#guide-glow-cyan)">
    <path d="M 0 140 L 220 140 L 290 200 L 480 200" />
    <circle cx="480" cy="200" r="4.5" fill="#22d3ee" />
    <path d="M 0 460 L 180 460 L 250 400 L 440 400" />
    <circle cx="440" cy="400" r="4.5" fill="#22d3ee" />
    
    <path d="M 1920 140 L 1700 140 L 1630 200 L 1440 200" stroke="rgba(96, 165, 250, 0.45)" />
    <circle cx="1440" cy="200" r="4.5" fill="#60a5fa" />
    <path d="M 1920 460 L 1740 460 L 1670 400 L 1480 400" stroke="rgba(96, 165, 250, 0.45)" />
    <circle cx="1480" cy="400" r="4.5" fill="#60a5fa" />
  </g>

  <!-- ========================================================= -->
  <!-- 3. SISI KIRI: STEAM REDEEM CLIENT & PC GAMER INTERFACE      -->
  <!-- ========================================================= -->
  <!-- Holographic Steam Window Card (X: 90, Y: 90) -->
  <g transform="translate(90, 85) rotate(-3)" filter="url(#guide-glow-cyan)">
    <rect width="270" height="165" rx="20" fill="url(#guide-card-grad)" stroke="#22d3ee" stroke-width="2.5" />
    <rect x="15" y="14" width="240" height="26" rx="8" fill="#1e293b" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1.2" />
    <circle cx="32" cy="27" r="4.5" fill="#ef4444" />
    <circle cx="46" cy="27" r="4.5" fill="#f59e0b" />
    <circle cx="60" cy="27" r="4.5" fill="#10b981" />
    <text x="145" y="31" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle" font-weight="bold">Steam Client • Product Activation</text>

    <!-- Steam Big Logo Inside Card -->
    <circle cx="68" cy="94" r="30" fill="#171a21" stroke="#22d3ee" stroke-width="2.5" />
    <path d="M 68 74 C 58 74 50 82 48 90 L 57 94 C 58 90 61 88 65 88 C 70 88 74 92 74 97 C 74 102 70 106 65 106 L 60 106 C 60 103 57 102 55 102 C 52 102 50 104 50 107 C 50 109 52 112 55 112 C 57 112 60 110 60 108 L 65 108 C 71 108 76 103 76 97 C 76 85 68 74 68 74 Z" fill="#ffffff" />
    <circle cx="80" cy="82" r="5.5" fill="#22d3ee" />

    <!-- Text Interface Inside Card -->
    <text x="115" y="80" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Product Code</text>
    <rect x="115" y="88" width="140" height="26" rx="6" fill="#0b0f19" stroke="#06b6d4" stroke-width="1.5" />
    <text x="185" y="105" font-family="monospace" font-size="11.5" fill="#22d3ee" text-anchor="middle" font-weight="bold">STEAM-XXXXX-KEY</text>

    <!-- Status Pill -->
    <rect x="115" y="122" width="85" height="20" rx="10" fill="rgba(16, 185, 129, 0.3)" stroke="#10b981" stroke-width="1.5" />
    <text x="157" y="136" font-family="sans-serif" font-size="9.5" fill="#34d399" text-anchor="middle" font-weight="bold">✓ VALID KEY</text>
  </g>

  <!-- Glowing Game Controller Icon Card (X: 180, Y: 320) -->
  <g transform="translate(180, 315) rotate(5)" filter="url(#guide-glow-purple)">
    <rect width="200" height="145" rx="22" fill="url(#guide-card-grad)" stroke="#c084fc" stroke-width="2.5" />
    <!-- Gamepad Path -->
    <path d="M 76 48 C 64 48 53 60 53 74 C 53 88 60 100 70 103 C 76 104 81 98 86 91 L 93 84 L 107 84 L 114 91 C 119 98 124 104 130 103 C 140 100 147 88 147 74 C 147 60 136 48 124 48 Z" fill="#1e1b4b" stroke="#a855f7" stroke-width="3" />
    <circle cx="82" cy="68" r="6" fill="#22d3ee" />
    <circle cx="125" cy="63" r="4.5" fill="#ec4899" />
    <circle cx="134" cy="71" r="4.5" fill="#10b981" />
    <circle cx="116" cy="71" r="4.5" fill="#f59e0b" />
    <circle cx="125" cy="79" r="4.5" fill="#38bdf8" />
    <text x="100" y="128" font-family="sans-serif" font-size="11" fill="#e9d5ff" text-anchor="middle" font-weight="bold">READY TO PLAY</text>
  </g>

  <!-- ========================================================= -->
  <!-- 4. SISI KANAN: UNLOCK GAME LIBRARY & DIGITAL VOUCHER CARDS -->
  <!-- ========================================================= -->
  <!-- Holographic Unlocked Game Card (X: 1560, Y: 85) -->
  <g transform="translate(1550, 85) rotate(4)" filter="url(#guide-glow-gold)">
    <rect width="270" height="165" rx="20" fill="url(#guide-card-grad)" stroke="#f59e0b" stroke-width="2.5" />
    <rect x="15" y="14" width="240" height="26" rx="8" fill="#1e293b" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
    <circle cx="32" cy="27" r="4.5" fill="#10b981" />
    <text x="145" y="31" font-family="sans-serif" font-size="10.5" fill="#fbbf24" text-anchor="middle" font-weight="bold">Library Activation Success</text>

    <!-- Glowing Trophy Icon -->
    <circle cx="68" cy="98" r="30" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M 57 82 L 79 82 L 76 100 C 75 107 70 110 68 110 C 66 110 61 107 60 100 Z" fill="#fbbf24" />
    <path d="M 57 85 L 49 85 C 47 85 46 91 49 94 L 58 97 Z" fill="#fbbf24" />
    <path d="M 79 85 L 87 85 C 89 85 90 91 87 94 L 78 97 Z" fill="#fbbf24" />
    <rect x="65" y="110" width="6" height="9" fill="#d97706" />
    <rect x="58" y="118" width="20" height="6" rx="2" fill="#fbbf24" />

    <text x="114" y="82" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Game Terbuka!</text>
    <text x="114" y="101" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">Masuk ke Library Steam</text>
    <rect x="114" y="112" width="125" height="24" rx="8" fill="rgba(16, 185, 129, 0.3)" stroke="#10b981" stroke-width="1.5" />
    <text x="176" y="128" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle" font-weight="bold">✓ 100% Permanen</text>
  </g>

  <!-- Glowing Download Badge Card (X: 1520, Y: 315) -->
  <g transform="translate(1520, 315) rotate(-5)" filter="url(#guide-glow-cyan)">
    <rect width="220" height="145" rx="22" fill="url(#guide-card-grad)" stroke="#22d3ee" stroke-width="2.5" />
    <!-- Download Arrow Icon -->
    <circle cx="110" cy="60" r="28" fill="#0b0f19" stroke="#22d3ee" stroke-width="2.5" />
    <path d="M 110 44 L 110 70 M 101 61 L 110 70 L 119 61" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 96 77 L 124 77" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />
    <text x="110" y="110" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Install &amp; Play</text>
    <text x="110" y="128" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="600">Server Resmi Valve</text>
  </g>

  <!-- ========================================================= -->
  <!-- 5. FLOATING GOLD COINS & SPARKLE ACCENTS                   -->
  <!-- ========================================================= -->
  <g transform="translate(390, 140)" filter="url(#guide-glow-gold)">
    <circle cx="18" cy="18" r="16" fill="#fbbf24" stroke="#fef08a" stroke-width="2.5" />
    <text x="18" y="24" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>
  <g transform="translate(410, 420)" filter="url(#guide-glow-gold)">
    <circle cx="16" cy="16" r="14" fill="#fbbf24" stroke="#fef08a" stroke-width="2" />
    <text x="16" y="21" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>
  <g transform="translate(1450, 150)" filter="url(#guide-glow-gold)">
    <circle cx="18" cy="18" r="16" fill="#fbbf24" stroke="#fef08a" stroke-width="2.5" />
    <text x="18" y="24" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>
  <g transform="translate(1430, 430)" filter="url(#guide-glow-gold)">
    <circle cx="16" cy="16" r="14" fill="#fbbf24" stroke="#fef08a" stroke-width="2" />
    <text x="16" y="21" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">★</text>
  </g>

  <!-- Star Sparkles -->
  <g fill="#22d3ee" opacity="0.9">
    <path d="M 450 280 Q 450 294 464 294 Q 450 294 450 308 Q 450 294 436 294 Q 450 294 450 280 Z" />
    <path d="M 1420 280 Q 1420 294 1434 294 Q 1420 294 1420 308 Q 1420 294 1406 294 Q 1420 294 1420 280 Z" fill="#c084fc" />
    <circle cx="330" cy="130" r="3.5" fill="#38bdf8" />
    <circle cx="1500" cy="230" r="3.5" fill="#fbbf24" />
  </g>
</svg>
